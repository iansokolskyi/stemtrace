name: CI

on:
  pull_request:
    # redesign: integration branch for the UI redesign until it merges to main as one release
    branches: [main, redesign]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
      STEMTRACE_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --all-extras

      - name: Lint with ruff
        run: uv run --locked --no-build ruff check src/ tests/

      - name: Check formatting
        run: uv run --locked --no-build ruff format --check src/ tests/

      - name: Check import contracts
        run: uv run --locked --no-build lint-imports

      - name: Check docstring length
        run: uv run --locked --no-build python scripts/check_docstring_length.py

      - name: Check public APIs have docstrings
        run: uv run --locked --no-build python scripts/check_docstrings.py

      - name: Check changelog fragments
        run: uv run --locked --no-build python scripts/assemble_changelog.py --check

  type-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
      STEMTRACE_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --all-extras

      - name: Type check with mypy
        run: uv run --locked --no-build mypy src/ --strict

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      STEMTRACE_SKIP_UI_BUILD: "1"
      REDIS_URL: redis://localhost:6379/15
    # Without Redis the real-worker integration tests skip with "Redis not available".
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --all-extras

      # coverage.py's C tracer (Python 3.10-3.13) makes the suite about 2x slower, so
      # only the Codecov version (3.14) measures coverage and enforces the 95% gate.
      # Blind spot: code that runs only on Python 3.10-3.13 (e.g. the tomli branch in
      # server/groups.py) is never coverage-measured.
      - name: Run tests
        if: matrix.python-version != '3.14'
        run: uv run --locked --no-build pytest -n auto --maxprocesses 8 --dist worksteal --durations=25

      - name: Run tests with coverage
        if: matrix.python-version == '3.14'
        run: uv run --locked --no-build pytest -n auto --maxprocesses 8 --dist worksteal --durations=25 --cov=stemtrace --cov-branch --cov-report=xml --cov-fail-under=95

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  test-lowest:
    name: Test lowest dependency versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.10"
      STEMTRACE_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      # The hashed pins (see `make lowest-pins`) must match pyproject.toml's
      # declared floors.
      - name: Check the pinned floors are current
        run: make lowest-pins-check || { echo "::error::lowest pins are stale; run make lowest-pins"; exit 1; }

      # The pinned floors of the runtime dependencies and the test tools resolved
      # against them (hash-checked), then the project itself without resolving
      # again. Nothing is built from source (--no-build).
      - name: Install the lowest declared versions
        run: |
          uv venv .venv-lowest
          uv pip install --python .venv-lowest --no-build --require-hashes \
            -r .github/lowest-requirements.txt -r .github/lowest-test-tools.txt
          uv pip install --python .venv-lowest --no-build --no-deps -e .

      # Old floors (e.g. typer) emit deprecation warnings under current click;
      # the suite turns warnings into errors, which isn't what this job checks.
      - name: Run unit tests
        run: .venv-lowest/bin/python -m pytest tests/unit -n auto --maxprocesses 8 --dist worksteal --durations=25 -p no:cacheprovider --no-cov -W ignore::DeprecationWarning

  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-emit-project --no-dev --output-file requirements-audit.txt

      - name: Audit for known vulnerabilities
        run: uvx --no-build pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requirements-audit.txt

  frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/stemtrace/server/ui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/stemtrace/server/ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint with Biome
        run: npm run check

      - name: Type check with TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check the bundle (prefix-safe asset URLs, no font CDN)
        run: node scripts/check-dist.mjs

  # Mock-mode Playwright (no Docker) plus the visual snapshots. It runs in the pinned
  # Playwright image so fonts render exactly as when the baselines were made
  # (npm run test:visual:update uses the same image). The image version must match
  # @playwright/test in package.json (pinned exactly; Dependabot ignores it).
  ui-mock-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        working-directory: src/stemtrace/server/ui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Mock E2E and visual snapshots
        run: npm test
        env:
          CI: "true"
          PW_VISUAL: "1"
          HOME: /root

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-mock
          path: src/stemtrace/server/ui/frontend/playwright-report/
          retention-days: 7

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    needs: [lint, type-check, test, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/stemtrace/server/ui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: src/stemtrace/server/ui/frontend

      - name: Install build tools
        run: uv sync --locked --no-build --all-extras --no-install-project

      - name: Build package
        run: uv run --locked --no-build --no-sync pyproject-build --no-isolation

      - name: Verify package
        run: uv run --locked --no-build --no-sync twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  coverage-main:
    # Keep PR checks as the main gate, but ensure Codecov gets updated for the
    # actual default-branch commit after merges (or direct pushes / releases).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
      STEMTRACE_SKIP_UI_BUILD: "1"
      REDIS_URL: redis://localhost:6379/15
    # Without Redis the real-worker integration tests skip with "Redis not available".
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --all-extras

      - name: Run tests (coverage only)
        run: uv run --locked --no-build pytest -n auto --maxprocesses 8 --dist worksteal --durations=25 --cov=stemtrace --cov-branch --cov-report=xml --cov-fail-under=95

      - name: Upload coverage (main)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
