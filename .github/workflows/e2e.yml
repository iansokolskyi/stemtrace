name: E2E Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      # The Docker images build their own UI; skip the host-side build.
      STEMTRACE_SKIP_UI_BUILD: "1"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        broker:
          - redis
          - rabbitmq

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Select compose file and Celery env
        run: |
          if [ "${{ matrix.broker }}" = "rabbitmq" ]; then
            echo "COMPOSE_FILE=docker-compose.e2e.rabbitmq.yml" >> "$GITHUB_ENV"
            echo "CELERY_BROKER_URL=amqp://guest:guest@localhost:5672//" >> "$GITHUB_ENV"
            echo "CELERY_RESULT_BACKEND=redis://localhost:16380/1" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_FILE=docker-compose.e2e.yml" >> "$GITHUB_ENV"
            echo "CELERY_BROKER_URL=redis://localhost:16379/0" >> "$GITHUB_ENV"
            echo "CELERY_RESULT_BACKEND=redis://localhost:16379/1" >> "$GITHUB_ENV"
          fi

      - name: Build images
        run: |
          docker compose -f "$COMPOSE_FILE" build

      - name: Start services
        run: |
          docker compose -f "$COMPOSE_FILE" up -d
          # Wait for services to be healthy
          echo "Waiting for services..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/stemtrace/api/health -o /dev/null; do sleep 2; done'
          echo "Services ready!"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --all-extras

      - name: Wait for the event consumer to connect
        run: |
          # /health answers 200 as soon as the API is up, even while the server's
          # broker consumer is still connecting. On RabbitMQ, events published
          # before it binds are lost (the fanout exchange drops unbound messages);
          # on Redis the stream is read from the start, so this only covers
          # consumer_connected being null before the first read. Seed or test
          # only once it reports connected.
          uv run --locked --no-build python scripts/wait_for_http.py \
            http://localhost:8000/stemtrace/api/health \
            --timeout 90 --interval 2 \
            --expect-json status=ok \
            --expect-json consumer_connected=true

      - name: Run API E2E tests
        run: uv run --locked --no-build pytest tests/e2e/ -m e2e -v --tb=short

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs

      - name: Stop services
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      # The Docker images build their own UI; skip the host-side build.
      STEMTRACE_SKIP_UI_BUILD: "1"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        broker:
          - redis
          - rabbitmq

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Select compose file and Celery env
        run: |
          if [ "${{ matrix.broker }}" = "rabbitmq" ]; then
            echo "COMPOSE_FILE=docker-compose.e2e.rabbitmq.yml" >> "$GITHUB_ENV"
            echo "CELERY_BROKER_URL=amqp://guest:guest@localhost:5672//" >> "$GITHUB_ENV"
            echo "CELERY_RESULT_BACKEND=redis://localhost:16380/1" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_FILE=docker-compose.e2e.yml" >> "$GITHUB_ENV"
            echo "CELERY_BROKER_URL=redis://localhost:16379/0" >> "$GITHUB_ENV"
            echo "CELERY_RESULT_BACKEND=redis://localhost:16379/1" >> "$GITHUB_ENV"
          fi

      - name: Build images
        run: |
          docker compose -f "$COMPOSE_FILE" build

      - name: Start services
        run: |
          docker compose -f "$COMPOSE_FILE" up -d
          echo "Waiting for services..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/stemtrace/api/health -o /dev/null; do sleep 2; done'
          echo "Services ready!"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --no-build --all-extras

      - name: Wait for the event consumer to connect
        run: |
          # /health answers 200 as soon as the API is up, even while the server's
          # broker consumer is still connecting. On RabbitMQ, events published
          # before it binds are lost (the fanout exchange drops unbound messages);
          # on Redis the stream is read from the start, so this only covers
          # consumer_connected being null before the first read. Seed or test
          # only once it reports connected.
          uv run --locked --no-build python scripts/wait_for_http.py \
            http://localhost:8000/stemtrace/api/health \
            --timeout 90 --interval 2 \
            --expect-json status=ok \
            --expect-json consumer_connected=true

      - name: Seed test tasks and wait for them
        run: |
          # tests/e2e/seed.py owns the list of seeded tasks and waits until every one
          # has reached its terminal state before the specs start. Events travel
          # worker -> broker -> server consumer, so the specs must not start before
          # then. This guards against worker/consumer startup lag; on timeout it
          # lists the tasks it did see.
          uv run --locked --no-build python -m tests.e2e.seed

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/stemtrace/server/ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/stemtrace/server/ui/frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: src/stemtrace/server/ui/frontend
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: src/stemtrace/server/ui/frontend
        run: npm test
        env:
          E2E_MODE: real
          PLAYWRIGHT_BASE_URL: http://localhost:8000

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.broker }}
          path: src/stemtrace/server/ui/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.broker }}
          path: src/stemtrace/server/ui/frontend/test-results/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs

      - name: Stop services
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v
