version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock (CI and images install from the lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Dependabot's uv updater fails on the build backend; updated by the
      # weekly maintenance routine
      - dependency-name: "hatchling"

  - package-ecosystem: npm
    directory: /src/stemtrace/server/ui/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Pinned to ^22: types must match the Node 22 runtime used in CI and Docker
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned exactly: it must match the Playwright image in ci.yml (ui-mock-e2e) and the
      # test:visual scripts in package.json. Bump all three together, then regenerate the
      # visual baselines with npm run test:visual:update.
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base images in Dockerfile and Dockerfile.e2e (tags pinned by digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The shipped Python runtime is deliberate: stay on 3.12.x patch updates
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # UI is built with Node 22 LTS: allow minor/patch updates only
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
