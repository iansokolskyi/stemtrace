[tool.bumpversion]
current_version = "0.4.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = false  # Tagged after the release PR merges (make release-tag)
message = "chore: release v{new_version}"

# Python package version in pyproject.toml
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# Python __version__ (leaf module, re-exported by the package __init__.py)
[[tool.bumpversion.files]]
filename = "src/stemtrace/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# Frontend package.json version
[[tool.bumpversion.files]]
filename = "src/stemtrace/server/ui/frontend/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# Frontend package-lock.json: root version and the root package entry
[[tool.bumpversion.files]]
filename = "src/stemtrace/server/ui/frontend/package-lock.json"
search = """"name": "stemtrace-ui",
  "version": "{current_version}\""""
replace = """"name": "stemtrace-ui",
  "version": "{new_version}\""""

[[tool.bumpversion.files]]
filename = "src/stemtrace/server/ui/frontend/package-lock.json"
search = """"name": "stemtrace-ui",
      "version": "{current_version}\""""
replace = """"name": "stemtrace-ui",
      "version": "{new_version}\""""

# uv.lock - keep workspace lockfile in sync (uv stores the local project version)
[[tool.bumpversion.files]]
filename = "uv.lock"
search = """name = "stemtrace"
version = "{current_version}"""
replace = """name = "stemtrace"
version = "{new_version}"""

# CHANGELOG.md - insert new version header
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
# A whole-line regex: a plain search replaces every match, including `## [Unreleased]`
# quoted inside an entry. bump-my-version 1.6.0 compiles with re.MULTILINE (config/models.py).
regex = true
search = '^## \[Unreleased\]$'
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""

# README.md - keep PyPI badge in sync with version (avoid cached badge drift)
[[tool.bumpversion.files]]
filename = "README.md"
search = "[![PyPI version](https://img.shields.io/badge/pypi-v{current_version}-darklime)](https://pypi.org/project/stemtrace)"
replace = "[![PyPI version](https://img.shields.io/badge/pypi-v{new_version}-darklime)](https://pypi.org/project/stemtrace)"

# CHANGELOG compare links: advance [unreleased], add the new version's link
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
# Anchored like the heading entry; {current_version} is re.escape'd in regex mode
# (bump-my-version 1.6.0, config/models.py get_search_pattern).
regex = true
search = '^\[unreleased\]: https://github\.com/iansokolskyi/stemtrace/compare/v{current_version}\.\.\.HEAD$'
replace = """[unreleased]: https://github.com/iansokolskyi/stemtrace/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/iansokolskyi/stemtrace/compare/v{current_version}...v{new_version}"""
