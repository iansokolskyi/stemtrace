[project]
name = "stemtrace"
version = "0.4.1"
description = "A lightweight Celery task flow visualizer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ian Sokolskyi", email = "iansokolskyi@gmail.com" },
]
maintainers = [
    { name = "Ian Sokolskyi", email = "iansokolskyi@gmail.com" },
]
keywords = ["celery", "task", "queue", "visualization", "monitoring", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "celery>=5.2.2",  # lowest version verified by the test suite (CI test-lowest job); 5.2.2 fixes CVE-2021-23727
    "pydantic>=2.4.0",  # lowest version verified by the test suite (CI test-lowest job); 2.4.0 fixes CVE-2024-3772
    "typing_extensions>=4.0.0",  # in practice pydantic's own minimum (4.6.1 for pydantic 2.2) applies
    "kombu>=5.2.2",  # imported directly (RabbitMQ transport); celery 5.2.2's minimum, verified by the test suite (CI test-lowest job)
    "redis>=4.1.0",  # lowest version verified by the test suite at release time; 4.0.x needs distutils (gone in Python 3.12)
    "fastapi>=0.112.1",  # lowest version verified by the test suite at release time
    "starlette>=0.38.6",  # imported directly; lowest version verified by the test suite at release time
    "typer>=0.16.0",  # first version whose --help works with click 8.2+ (passes make_metavar its ctx); verified by the test suite
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.24.0",  # Required for healthchecks in Docker
    "tomli>=1.2.2; python_version < '3.11'",  # task group TOML files on Python 3.10 (tomllib from 3.11); lowest version verified by the test suite (hatchling, in the test tools, needs 1.2.2)
]

[project.optional-dependencies]
# Development
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "types-redis>=4.0.0",
    "hatchling>=1.20.0",  # For build hook IDE support
    "bump-my-version>=0.28.0",
    "websockets>=12.0",  # For WebSocket E2E tests
    "build>=1.0.0",  # For local package builds
    "twine>=5.0.0",  # For package verification
    "import-linter>=2.0",  # Enforces the core/library/server import boundaries (make lint, CI)
    "gevent>=25.4.1",  # DNS helper tests under gevent's monkey-patching
    "eventlet>=0.39.0",  # DNS helper tests under eventlet's monkey-patching
]

[project.urls]
Homepage = "https://github.com/iansokolskyi/stemtrace"
Documentation = "https://github.com/iansokolskyi/stemtrace/tree/main/docs"
Repository = "https://github.com/iansokolskyi/stemtrace"
Issues = "https://github.com/iansokolskyi/stemtrace/issues"
Changelog = "https://github.com/iansokolskyi/stemtrace/blob/main/CHANGELOG.md"

[project.scripts]
stemtrace = "stemtrace.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemtrace"]
artifacts = [
    "src/stemtrace/server/ui/frontend/dist/**",
    "src/stemtrace/server/ui/templates/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_ui.py"

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "typer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kombu.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "amqp.*"
ignore_missing_imports = true

# =============================================================================
# ruff
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific
    "PGH004", # blanket noqa (always name the rule)
    "D",      # pydocstyle
    "C90",    # mccabe complexity
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments (make extra params keyword-only)
    "BLE",    # blind except (allowed only with `# noqa: BLE001  <reason>`)
    "ERA",    # commented-out code
    "RET",    # flake8-return
    "PT",     # flake8-pytest-style
    "PLR0402", # manual from-import
    "PLR1711", # useless return
    "PLR1714", # repeated equality comparison
    "PLR5501", # collapsible else-if
]
# Baseline: code that predates the rules above carries a per-line
# `# noqa: <codes>` (added with `ruff check --add-noqa`), to be removed by
# refactors. Don't add bare noqa comments: a new one needs a reason after the
# codes, e.g. `# noqa: BLE001  fire-and-forget: ...`. RUF100 (via "RUF") flags
# any noqa that no longer suppresses anything, so the baseline only shrinks.
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# pylint defaults, written down so the limits are visible
max-branches = 12
max-returns = 6
max-statements = 50
max-positional-args = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["stemtrace"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ARG"]  # No docstrings required in tests
"examples/**/*.py" = ["ARG001", "D417"]  # bind=True tasks have unused self

# =============================================================================
# import-linter (architecture boundaries, see CONTRIBUTING.md)
# =============================================================================
[tool.importlinter]
root_package = "stemtrace"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is independent of library, server and transports"
type = "forbidden"
source_modules = ["stemtrace.core"]
forbidden_modules = ["stemtrace.library", "stemtrace.server", "stemtrace.transports"]

[[tool.importlinter.contracts]]
name = "core uses no broker, Celery or web libraries"
type = "forbidden"
source_modules = ["stemtrace.core"]
forbidden_modules = [
    "amqp",
    "celery",
    "fastapi",
    "httpx",
    "kombu",
    "redis",
    "starlette",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "library does not import server"
type = "forbidden"
source_modules = ["stemtrace.library"]
forbidden_modules = ["stemtrace.server"]

[[tool.importlinter.contracts]]
name = "server does not import library"
type = "forbidden"
source_modules = ["stemtrace.server"]
forbidden_modules = ["stemtrace.library"]

[[tool.importlinter.contracts]]
name = "transports import only core (library and server both use them)"
type = "forbidden"
source_modules = ["stemtrace.transports"]
forbidden_modules = ["stemtrace.library", "stemtrace.server"]

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not e2e",  # Exclude E2E tests by default (run with: pytest -m e2e)
]
markers = [
    "integration: requires running services (Redis, Celery)",
    "e2e: end-to-end tests (slow, requires Docker)",
    "slow: tests that take > 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    # Starlette 1.x TestClient prefers httpx2 but still supports httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["src/stemtrace"]
branch = true
omit = [
    "src/stemtrace/server/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol method stubs (a bare `...` body line)
    "class.*Protocol.*:",
]
